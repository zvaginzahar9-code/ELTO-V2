# ELTO — пример конфигурации nginx для размещения без Vercel.
#
# Сайт собирается в статику: `SITE_ORIGIN=https://elto.kz npm run build`,
# содержимое dist/ копируется в root ниже. Повторяет правила vercel.json:
# главная на трёх языках отдаётся готовой страницей home-*.html, остальные
# адреса — index.html (маршрутизация на клиенте), плюс заголовки и кэш.
#
# Форма заявки на таком хостинге: серверная функция api/lead.ts работает
# только на Vercel. Без неё форма получает ошибку и сама предлагает отправить
# заявку письмом или в WhatsApp — заявка не теряется. Чтобы письма уходили
# автоматически, нужен обработчик POST /api/lead (см. README, «Форма заявки»).

server {
    listen 443 ssl http2;
    server_name elto.kz www.elto.kz;

    # ssl_certificate     /etc/letsencrypt/live/elto.kz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/elto.kz/privkey.pem;

    root /var/www/elto/dist;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # главная: готовая страница с первым экраном
    location = / { try_files /home-ru.html =404; }
    location ~ ^/(ru|kk|en)/?$ { try_files /home-$1.html =404; }

    # статика с хэшем в имени — годовой кэш
    location ~ ^/(assets|fonts|img|seq|media)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /docs/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location /data/ { add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400"; try_files $uri =404; }

    # всё остальное — приложение (включая старые адреса /ru/content/…)
    location / { try_files $uri /index.html; }
}

server {
    listen 80;
    server_name elto.kz www.elto.kz;
    return 301 https://elto.kz$request_uri;
}
