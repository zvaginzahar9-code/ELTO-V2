    <!--
      Стиль стартового кадра — единственное, что вставлено в HTML. Он нужен
      до того, как приедет бандл стилей: иначе первая отрисовка ждёт лишний
      круг по сети, а на мобильной сети круг стоит больше полусекунды.
      Величины повторяют .hero__mark из styles/scenes.css.
    -->
    <style>
      body {
        margin: 0;
        background: #f4f3f8;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        align-items: center;
        background: #f4f3f8;
      }
      .boot__inner {
        width: 100%;
        max-width: 1720px;
        margin-inline: auto;
        padding-inline: clamp(1rem, 4vw, 4rem);
      }
      .boot__mark {
        display: block;
        width: clamp(180px, 20vw, 290px);
        height: auto;
      }
      @media (max-width: 860px) {
        .boot__mark {
          width: clamp(150px, 46vw, 220px);
        }
      }
    </style>
